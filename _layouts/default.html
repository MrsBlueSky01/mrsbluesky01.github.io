<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>
    {% include meta.html %}
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    
   <style>
  /* GENEL AYARLAR */
  body { 
      background-color: #000 !important; 
      margin: 0; 
      font-family: 'Inter', sans-serif; 
      color: #fff;
  }

  /* 1. ARKA PLAN KATMANI (SABİT) */
  .hero-section {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      position: fixed; 
      top: 0;
      left: 0;
      z-index: 1; /* Arka planda kalmalı ama çok dipte değil */
  }

  #bg-terminal {
      color: rgba(255, 20, 147, 1);
      font-family: 'Courier New', monospace;
      font-size: clamp(18px, 3.5vw, 32px); 
      width: 90%;
      max-width: 1200px;
      line-height: 1.2;
      text-align: left;
      white-space: pre-wrap;
      text-shadow: 0 0 3px #f8a5e3, 0 0 10px #940c94, 0 0 20px #fd7dc1, 0 0 40px #d540ad;
      filter: brightness(1.75) contrast(1.2); 
      animation: flicker 7s infinite;
  }

  @keyframes flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
      20%, 24%, 55% { opacity: 0.8; }
  }

  /* 2. HEADER (MASTHEAD) */
  .wrapper-masthead {
      margin-top: 70vh; /* Terminal yazısının biraz altında başlasın */
      position: relative;
      z-index: 20; /* Her şeyin üstünde olmalı */
      background: rgba(0, 0, 0, 0.9) !important;
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(253, 125, 193, 0.3);
      padding: 1.5rem 0;
  }

  .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
  }

  .site-avatar { display: flex; align-items: center; gap: 15px; text-decoration: none; }
  .site-avatar img { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #fd7dc1; }

  .site-info { display: flex !important; flex-direction: column !important; align-items: flex-start !important; }
  .site-name { margin: 0 !important; font-size: 1.8rem !important; }
  .site-name a { color: #fd7dc1 !important; text-decoration: none !important; }
  .site-description { margin: 5px 0 0 0 !important; color: #fff !important; font-size: 0.9rem !important; opacity: 0.8; }

  nav { display: flex; gap: 20px; }
  nav a { color: #fff; text-decoration: none; font-weight: 500; text-transform: uppercase; transition: 0.3s; }
  nav a:hover { color: #fd7dc1; }

  /* 3. ANA İÇERİK ALANI (BLOG POSTLARI BURADA) */
  #main {
      position: relative; 
      z-index: 15; /* Terminalin üstünde, masthead'in altında/hizasında */
      background: #0a0a0a; /* Şeffaf değil, yazılar okunmalı */
      padding: 60px 20px;
      max-width: 900px;
      margin: 0 auto;
      min-height: 100vh;
      box-shadow: 0 -20px 50px rgba(0,0,0,0.5); /* Geçişi yumuşatır */
  }

  /* Mobilde bozulmaması için */
  @media screen and (max-width: 768px) {
      .masthead { flex-direction: column; text-align: center; }
      .site-info { align-items: center !important; }
      .wrapper-masthead { margin-top: 50vh; }
  }
</style>
</head>
  
<body>
    <section class="hero-section">
        <div id="bg-terminal"></div>
    </section>

    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead">
          <div class="site-header-left">
            <a href="{{ site.baseurl }}/" class="site-avatar">
              <img src="{{ site.avatar }}" alt="{{ site.name }}" />
              <div class="site-info">
                <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
                <p class="site-description">{{ site.description }}</p>
              </div>
            </a>
          </div>
          <nav>
            <a href="{{ site.baseurl }}/">Blog</a>
            <a href="{{ site.baseurl }}/about">About</a>
            <a href="{{ site.baseurl }}/portfolio">Portfolio</a>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    <script>
        const bgTerminal = document.getElementById('bg-terminal');
        const codeText = `using Godot;
using System;

// Game Dev Journey: Day 365
public partial class Player : CharacterBody2D
{
    public override void _PhysicsProcess(double delta)
    {
        if (IsJobSearching) {
            LearnNewSkills();
            KeepCoding();
            StayFabulous();
        }
    }
}`;

        let index = 0;
        let isDeleting = false;

        function type() {
            const currentText = codeText.substring(0, index);
            bgTerminal.innerText = currentText;

            if (!isDeleting && index < codeText.length) {
                index++;
                setTimeout(type, 50);
            } else if (isDeleting && index > 0) {
                index--;
                setTimeout(type, 20);
            } else if (!isDeleting && index === codeText.length) {
                isDeleting = true;
                setTimeout(type, 3000); 
            } else if (isDeleting && index === 0) {
                isDeleting = false;
                setTimeout(type, 500);
            }
        }
        type();
    </script>
</body>
</html>
