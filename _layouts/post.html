---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <div class="entry">
    {{ content }}
  </div>

  <div class="date">
    Written on {{ page.date | date: "%B %e, %Y" }}
  </div>

  {% include disqus.html %}
</article>
<style>
  .post { color: #ffffff; }
  .post h1, .post h2, .post h3 { color: #fd7dc1; }
  .entry { color: #ffffff; }
  /* Yazıların okunaklı olması için hafif bir gölge */
  .entry p { text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
</style>
