<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Neon Header Önizleme</title>
    <style>
        body { background-color: #000 !important; margin: 0; padding: 0; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* 1. ARKA PLAN KATMANI (SABİTLENDİ) */
        .hero-section {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            position: fixed; 
            top: 0;
            left: 0;
            z-index: -1; 
        }

        #bg-terminal {
            color: rgba(255, 20, 147, 1);
            font-family: 'Courier New', monospace;
            font-size: clamp(18px, 3.5vw, 32px); 
            width: 95%; 
            max-width: 1200px; 
            line-height: 1.2;
            text-align: left;
            white-space: pre-wrap;

            /* SENİN KARAR KILDIĞIN O EFSANE PARLAKLIK */
            text-shadow:
                0 0 3px #f8a5e3,
                0 0 10px #940c94,
                0 0 20px #fd7dc1,
                0 0 40px #d540ad,
                0 0 80px #fd6de2,
                0 0 100px #ef86f3;
            
            filter: brightness(1.75) contrast(1.2); 
            animation: flicker 7s infinite;
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.8; }
        }

        /* 2. GENİŞ VE MODERN HEADER */
        .wrapper-masthead {
            margin-top: 80vh; 
            position: relative;
            z-index: 10;
            background: rgba(0, 0, 0, 0.85) !important;
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(253, 125, 193, 0.2);
            padding: 1rem 0;
        }

        .masthead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .site-avatar {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .site-avatar img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #fd7dc1;
            background: #222;
        }

        .site-name { margin: 0; font-size: 1.8rem; }
        .site-name a {
            color: #fd7dc1 !important;
            text-decoration: none;
            text-shadow: 0 0 10px rgba(253, 125, 193, 0.4);
        }

        nav { display: flex; gap: 30px; }
        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            transition: 0.3s;
        }

        nav a:hover { color: #fd7dc1; }
        nav a::after {
            content: '';
            position: absolute;
            width: 0; height: 2px;
            bottom: -5px; left: 0;
            background-color: #fd7dc1;
            transition: width 0.3s ease;
        }
        nav a:hover::after { width: 100%; }

        /* İÇERİK ALANI */
        #main {
            position: relative; 
            z-index: 5;
            background: rgba(0, 0, 0, 0.8); 
            padding: 60px 0;
            min-height: 100vh;
        }

        .container { max-width: 800px; margin: 0 auto; padding: 0 20px; }

        .post-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(253, 125, 193, 0.1);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            transition: 0.3s;
        }

        .post-card:hover {
            border-color: rgba(253, 125, 193, 0.4);
            transform: translateY(-5px);
        }

        h2 { color: #fd7dc1; margin-top: 0; }
        p { line-height: 1.6; color: #ccc; }
    </style>
</head>
<body>

    <section class="hero-section">
        <div id="bg-terminal"></div>
    </section>

    <div class="wrapper-masthead">
        <header class="masthead">
            <div class="site-avatar">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Ayse" alt="Avatar">
                <div class="site-info">
                    <h1 class="site-name"><a href="#">Ayşe Yaren</a></h1>
                </div>
            </div>
            <nav>
                <a href="#">Blog</a>
                <a href="#">About</a>
                <a href="#">Projects</a>
            </nav>
        </header>
    </div>

    <div id="main">
        <div class="container">
            <article class="post-card">
                <h2>C# ile Oyun Geliştirme Yolculuğu</h2>
                <p>Godot Engine kullanarak geliştirdiğim projelerde karşılaştığım zorluklar ve çözüm yolları...</p>
            </article>
            <article class="post-card">
                <h2>Neon Tasarımın Gücü</h2>
                <p>Bir web sitesinde doğru kontrast ve parlaklık ayarları kullanıcı deneyimini nasıl etkiler?</p>
            </article>
            <div style="height: 500px;"></div>
        </div>
    </div>

    <script>
        const bgTerminal = document.getElementById('bg-terminal');
        const codeText = `using Godot;
using System;

// Game Dev Journey: Modern Header Updated
public partial class Player : CharacterBody2D
{
    public override void _PhysicsProcess(double delta)
    {
        if (DesignIsModern) {
            Layout = "Wide and Clean";
            Colors = "Neon Pink & Deep Black";
            StayFabulous();
        }
    }
}`;

        let index = 0;
        let isDeleting = false;

        function type() {
            const currentText = codeText.substring(0, index);
            bgTerminal.innerText = currentText;

            if (!isDeleting && index < codeText.length) {
                index++;
                setTimeout(type, 40);
            } else if (isDeleting && index > 0) {
                index--;
                setTimeout(type, 15);
            } else if (!isDeleting && index === codeText.length) {
                isDeleting = true;
                setTimeout(type, 3000); 
            } else if (isDeleting && index === 0) {
                isDeleting = false;
                setTimeout(type, 500);
            }
        }
        type();
    </script>
</body>
</html>
